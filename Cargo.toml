[package]
name = "claprs"
version = "0.1.0"
edition = "2024"
description = "Command line APRS tracker for following stations and areas from your terminal via APRS-IS"
license = "MIT"
repository = "https://github.com/benwoody/claprs"
readme = "README.md"
keywords = ["aprs", "ham-radio", "cli", "tracker", "amateur-radio"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
